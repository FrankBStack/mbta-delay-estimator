# Serves the built frontend and proxies the API on the same origin, so CORS
# never comes up. `api` is the compose service name.

# upstream status and timings alongside the usual fields
log_format upstream '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    'up=$upstream_status ut=$upstream_response_time rt=$request_time '
                    '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log upstream;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's DNS. Resolving `api` per request (a variable in proxy_pass
    # forces that) rather than once at startup, so a recreated API container
    # on a new address is picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/(api|docs|redoc|openapi\.json|healthz) {
        set $api http://api:8010;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Caddy terminates TLS, so $scheme here is always http; pass its header on
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # live data, never worth a browser caching; a cached redirect once
        # took the page down for one profile
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
