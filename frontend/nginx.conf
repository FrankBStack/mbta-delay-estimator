# Serves the built frontend and proxies the API on the same origin, so CORS
# never comes up. `api` is the compose service name.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ ^/(api|docs|redoc|openapi\.json|healthz) {
        proxy_pass http://api:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Caddy terminates TLS, so $scheme here is always http; pass its header on
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # live data, never worth a browser caching; a cached redirect once
        # took the page down for one profile
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
