# Production overlay. Adds Caddy for TLS, takes the password and domain from
# .env, and sizes Postgres for a 6 GB box shared with the API and poller.

x-prod-env: &prod-env
  DATABASE_URL: postgresql://tracker:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/tracker

services:
  db:
    command: postgres -c shared_buffers=1GB -c work_mem=32MB -c maintenance_work_mem=256MB
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  api:
    environment:
      <<: *prod-env
      DB_POOL_MIN: "1"
      DB_POOL_MAX: "4"

  poller:
    environment:
      <<: *prod-env
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}

  load:
    environment:
      <<: *prod-env

  caddy:
    # the base file's log cap, repeated: anchors don't cross files
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      # the directory, not the file: git replaces the file with a new inode on
      # pull, and a single-file bind mount keeps pointing at the old one, so
      # `caddy reload` would silently reload the previous config
      - ./deploy:/etc/caddy:ro
      - caddy-data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy-data:
